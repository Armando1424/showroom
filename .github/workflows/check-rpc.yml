name: Check RPCs (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call functions as admin
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["TOKEN"]
          url = "https://api.supabase.com/v1/projects/tojdcyzdeigiynvvvrwz/database/query"
          sub = "34b4c30d-086f-4736-84aa-81b3b4c2f1d1"

          def q(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode()

          claims = json.dumps({"sub": sub, "role": "authenticated"}).replace("'", "''")
          prefix = f"select set_config('request.jwt.claims', '{claims}', false); "

          calls = {
              "reporte_ventas": "select * from public.reporte_ventas('2025-01-01'::timestamptz, now(), '%s'::uuid);" % sub,
              "resumen_ventas": "select * from public.resumen_ventas('2025-01-01'::timestamptz, now(), 'month', '%s'::uuid);" % sub,
              "ventas_por_vendedor": "select * from public.ventas_por_vendedor('2025-01-01'::timestamptz, now(), '%s'::uuid);" % sub,
          }

          for name, body in calls.items():
              print(f"=== {name} ===")
              try:
                  print(q(prefix + body))
              except Exception as exc:
                  print("ERROR:", exc)
                  if hasattr(exc, "read"):
                      print(exc.read().decode())
          PY
