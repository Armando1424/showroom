name: Diagnose credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Management API with the service role key
        env:
          SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REF: tojdcyzdeigiynvvvrwz
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          service = os.environ["SERVICE"]
          ref = os.environ["REF"]

          def call(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {service}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.read().decode()[:300]
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()[:300]

          print("SQL:", call("POST", f"https://api.supabase.com/v1/projects/{ref}/database/query", {"query": "select 1 as ok"}))
          print("FUNCTIONS:", call("GET", f"https://api.supabase.com/v1/projects/{ref}/functions"))
          PY
