name: Setup login users

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar y validar logins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WILL_PASSWORD: ${{ secrets.WILL_TEST_PASSWORD }}
          CRISTIAN_PASSWORD: ${{ secrets.CRISTIAN_TEST_PASSWORD }}
        run: |
          python3 scripts/setup_login_users.py \
            --username-email \
            --set "will=$WILL_PASSWORD" \
            --set "cristian=$CRISTIAN_PASSWORD"
