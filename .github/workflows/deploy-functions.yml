# Despliega las Edge Functions (manual).
name: Deploy functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta SUPABASE_ACCESS_TOKEN; se omite el despliegue de funciones."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.check.outputs.configured == 'true'
        name: Set SITE_URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set SITE_URL=https://armando1424.github.io/showroom/ \
            --project-ref tojdcyzdeigiynvvvrwz

      - if: steps.check.outputs.configured == 'true'
        name: Deploy admin-users
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy admin-users \
            --project-ref tojdcyzdeigiynvvvrwz
