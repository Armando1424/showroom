name: Check data (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["TOKEN"]
          url = "https://api.supabase.com/v1/projects/tojdcyzdeigiynvvvrwz/database/query"

          def q(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode() or "[]")

          print("=== conteos ===")
          print(q("""
            select
              (select count(*) from public.productos) as total,
              (select count(*) from public.productos where deleted_at is null) as vivos,
              (select count(*) from public.productos where deleted_at is not null) as borrados,
              (select count(*) from public.productos where estado = 'disponible') as disponibles,
              (select count(*) from public.productos where estado = 'vendido') as vendidos,
              (select count(*) from public.ventas) as ventas,
              (select count(*) from public.user_roles where rol = 'proveedor') as usuarios_proveedor,
              (select count(*) from public.productos p
                 where p.deleted_at is null
                   and (p.proveedor_id is null
                        or not exists (select 1 from public.user_roles ur
                                       where ur.user_id = p.proveedor_id and ur.rol = 'proveedor')))
                as huerfanos
          """))

          print("=== productos ===")
          print(q("""
            select p.nombre, p.estado, p.precio, p.proveedor_id,
                   pr.nombre as proveedor_nombre, pr.activo as proveedor_activo,
                   (select count(*) from public.user_roles ur
                     where ur.user_id = p.proveedor_id and ur.rol = 'proveedor') as tiene_rol_proveedor
              from public.productos p
              left join public.profiles pr on pr.id = p.proveedor_id
             order by p.created_at
          """))

          print("=== usuarios y roles ===")
          print(q("""
            select pr.nombre, pr.email, pr.activo, pr.proveedor_id,
                   coalesce(string_agg(ur.rol, ',' order by ur.rol), '') as roles
              from public.profiles pr
              left join public.user_roles ur on ur.user_id = pr.id
             group by pr.id, pr.nombre, pr.email, pr.activo, pr.proveedor_id
             order by pr.created_at
          """))
          PY
