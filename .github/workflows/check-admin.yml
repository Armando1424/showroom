# Diagnóstico del primer admin (solo manual).
name: Check admin login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          if [ -z "$SERVICE" ] || [ -z "$ANON" ] || [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secretos para validar el admin; se omite."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check admin
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: python3 scripts/check_admin.py
