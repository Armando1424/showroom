name: Set user roles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asegurar roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/set_user_roles.py \
            --role will=admin \
            --role cristian=proveedor
