# Purga diaria en dos etapas (7 y 30 días).
name: Purge

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta SUPABASE_SERVICE_ROLE_KEY; se omite la purga."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.check.outputs.configured == 'true'
        name: Install dependencies
        run: pip install requests

      - if: steps.check.outputs.configured == 'true'
        name: Run purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PURGE_LOGICAL_DAYS: '7'
          PURGE_PHYSICAL_DAYS: '30'
        run: python scripts/purge.py
